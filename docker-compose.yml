services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facekey
      POSTGRES_USER: facekey
      POSTGRES_PASSWORD: facekey_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - facekey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facekey -d facekey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  facekey-postgres:
